<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Scoreboard — CatchIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:    #060e1a;
      --deep:    #0a1628;
      --surface: #0f2040;
      --teal:    #00c9a7;
      --mist:    #b8cfe0;
      --fog:     #546e80;
      --white:   #eef4f8;
      --gold:    #f5a623;
      --silver:  #aab4be;
      --bronze:  #cd7f32;
      --accent:  #1E6FD9;
    }

    body {
      background: var(--navy);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: var(--deep);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 28px 24px 24px;
      text-align: center;
      position: relative;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(231,76,60,0.15);
      border: 1px solid rgba(231,76,60,0.4);
      color: #e74c3c;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .live-dot {
      width: 6px; height: 6px;
      background: #e74c3c;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .header-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .header-logo {
      width: 52px; height: 52px;
      border-radius: 12px;
      object-fit: cover;
      display: none;
    }
    .header-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
    }
    .header-tagline {
      color: var(--mist);
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .powered-by {
      margin-top: 12px;
      font-size: 0.75rem;
      color: var(--fog);
    }
    .powered-by a { color: var(--teal); text-decoration: none; }
    .last-updated {
      font-size: 0.7rem;
      color: var(--fog);
      margin-top: 4px;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: var(--deep);
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .tab {
      flex: 1;
      padding: 14px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--fog);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── Leaderboard ── */
    .leaderboard {
      padding: 16px;
    }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.05);
      transition: transform 0.1s;
    }
    .lb-row:hover { transform: translateX(2px); }
    .lb-rank {
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      font-weight: 700;
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }
    .lb-rank.r1 { color: var(--gold); }
    .lb-rank.r2 { color: var(--silver); }
    .lb-rank.r3 { color: var(--bronze); }
    .lb-rank.rn { color: var(--fog); font-size: 0.85rem; }
    .lb-info { flex: 1; min-width: 0; }
    .lb-name {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lb-team {
      font-size: 0.75rem;
      color: var(--mist);
      margin-top: 2px;
    }
    .lb-stats {
      text-align: right;
      flex-shrink: 0;
    }
    .lb-catches {
      font-family: 'DM Mono', monospace;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
    }
    .lb-catches-label { font-size: 0.65rem; color: var(--fog); }
    .lb-best {
      font-size: 0.75rem;
      color: var(--mist);
      font-family: 'DM Mono', monospace;
      margin-top: 2px;
    }

    /* ── Roster table ── */
    .roster {
      padding: 16px;
      display: none;
    }
    .roster-filter {
      width: 100%;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      padding: 10px 14px;
      margin-bottom: 14px;
      outline: none;
    }
    .roster-filter::placeholder { color: var(--fog); }
    .roster-table {
      width: 100%;
      border-collapse: collapse;
    }
    .roster-table th {
      text-align: left;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--fog);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .roster-table td {
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.88rem;
      color: var(--mist);
    }
    .roster-table tr:last-child td { border-bottom: none; }
    .roster-count {
      font-size: 0.78rem;
      color: var(--fog);
      margin-bottom: 10px;
    }

    /* ── Empty / loading ── */
    .state-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--fog);
    }
    .state-msg h2 { font-size: 1.2rem; margin-bottom: 8px; color: var(--mist); }
    .empty-lb {
      text-align: center;
      padding: 32px;
      color: var(--fog);
      font-size: 0.88rem;
    }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.75rem;
      color: var(--fog);
      border-top: 1px solid rgba(255,255,255,0.06);
      margin-top: 24px;
    }
    footer a { color: var(--teal); text-decoration: none; }
  </style>
</head>
<body>

  <div id="loading" class="state-msg"><h2>Loading…</h2></div>

  <div id="app" style="display:none">
    <div class="header">
      <div class="live-badge"><span class="live-dot"></span>Live Scoreboard</div>
      <div class="header-brand">
        <img id="header-logo" class="header-logo" alt="Tournament logo">
        <span id="header-name" class="header-name"></span>
      </div>
      <div id="header-tagline" class="header-tagline"></div>
      <div id="last-updated" class="last-updated"></div>
      <div class="powered-by">Scoreboard powered by <a href="https://catchiq.fishing">CatchIQ</a></div>
    </div>

    <div class="tabs">
      <div class="tab active" id="tab-lb" onclick="showTab('lb')">Leaderboard</div>
      <div class="tab" id="tab-roster" onclick="showTab('roster')">Roster</div>
    </div>

    <div id="panel-lb" class="leaderboard"></div>

    <div id="panel-roster" class="roster">
      <input class="roster-filter" type="text" placeholder="Search angler or team…" oninput="filterRoster(this.value)">
      <div id="roster-count" class="roster-count"></div>
      <table class="roster-table" id="roster-table">
        <thead>
          <tr>
            <th>Angler</th>
            <th>Team</th>
            <th>Location</th>
          </tr>
        </thead>
        <tbody id="roster-body"></tbody>
      </table>
    </div>
  </div>

  <div id="error" class="state-msg" style="display:none">
    <h2>Page not found</h2>
    <p>This tournament page doesn't exist or has been taken offline.</p>
  </div>

  <footer>
    <a href="https://catchiq.fishing">CatchIQ</a> — Fish Smarter. Navigate Better.
  </footer>

<script>
  const API = 'https://api.catchiq.fishing';
  const REFRESH_MS = 30000; // auto-refresh leaderboard every 30s

  const slug = new URLSearchParams(window.location.search).get('id');
  let allRoster = [];

  if (!slug) {
    showError();
  } else {
    load();
    setInterval(load, REFRESH_MS);
  }

  function load() {
    fetch(`${API}/api/v1/public/tournament/${encodeURIComponent(slug)}`)
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(render)
      .catch(() => showError());
  }

  function render(data) {
    const { page, roster, leaderboard } = data;

    // Accent color
    if (page.accentColor) {
      document.documentElement.style.setProperty('--accent', page.accentColor);
    }

    // Header
    document.title = `${page.displayName} — CatchIQ`;
    document.getElementById('header-name').textContent = page.displayName;
    if (page.tagline) document.getElementById('header-tagline').textContent = page.tagline;
    if (page.logoUrl) {
      const logo = document.getElementById('header-logo');
      logo.src = page.logoUrl;
      logo.style.display = 'block';
    }
    document.getElementById('last-updated').textContent =
      'Updated ' + new Date().toLocaleTimeString();

    // Leaderboard
    const lbPanel = document.getElementById('panel-lb');
    if (!leaderboard.length) {
      lbPanel.innerHTML = '<div class="empty-lb">No catches recorded yet. Check back soon!</div>';
    } else {
      lbPanel.innerHTML = leaderboard.map((a, i) => {
        const rank = i + 1;
        const rankClass = rank === 1 ? 'r1' : rank === 2 ? 'r2' : rank === 3 ? 'r3' : 'rn';
        const rankLabel = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
        return `
          <div class="lb-row">
            <div class="lb-rank ${rankClass}">${rankLabel}</div>
            <div class="lb-info">
              <div class="lb-name">${esc(a.anglerName)}</div>
              ${a.teamName ? `<div class="lb-team">${esc(a.teamName)}</div>` : ''}
            </div>
            <div class="lb-stats">
              <div class="lb-catches">${a.catchCount}</div>
              <div class="lb-catches-label">catches</div>
              ${a.biggestLengthIn ? `<div class="lb-best">${parseFloat(a.biggestLengthIn).toFixed(1)}"</div>` : ''}
              ${a.biggestWeightLb ? `<div class="lb-best">${parseFloat(a.biggestWeightLb).toFixed(1)} lb</div>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    // Roster
    allRoster = roster;
    renderRoster(roster);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }

  function renderRoster(rows) {
    document.getElementById('roster-count').textContent = `${rows.length} registered angler${rows.length !== 1 ? 's' : ''}`;
    document.getElementById('roster-body').innerHTML = rows.map(a => `
      <tr>
        <td>${esc(a.angler_name)}</td>
        <td>${esc(a.team_name || '—')}</td>
        <td>${[a.city, a.state].filter(Boolean).map(esc).join(', ') || '—'}</td>
      </tr>`).join('');
  }

  function filterRoster(q) {
    const lower = q.toLowerCase();
    const filtered = lower
      ? allRoster.filter(a =>
          (a.angler_name || '').toLowerCase().includes(lower) ||
          (a.team_name  || '').toLowerCase().includes(lower))
      : allRoster;
    renderRoster(filtered);
  }

  function showTab(id) {
    document.getElementById('panel-lb').style.display     = id === 'lb'     ? 'block' : 'none';
    document.getElementById('panel-roster').style.display = id === 'roster' ? 'block' : 'none';
    document.getElementById('tab-lb').classList.toggle('active',     id === 'lb');
    document.getElementById('tab-roster').classList.toggle('active', id === 'roster');
  }

  function showError() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display   = 'block';
  }

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
