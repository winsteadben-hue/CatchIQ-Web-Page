<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep ocean gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2540;stop-opacity:1" />
    </linearGradient>

    <!-- Teal accent gradient for fish -->
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c9a7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00e5c0;stop-opacity:1" />
    </linearGradient>

    <!-- Gold gradient for IQ arc -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5a623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7c560;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter for fish -->
    <filter id="fishGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for gold arc -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- iOS-style rounded rect mask -->
    <clipPath id="iosClip">
      <rect width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>
  </defs>

  <!-- Background with iOS corner radius -->
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bgGrad)"/>

  <!-- Subtle water ripple lines -->
  <g opacity="0.06" clip-path="url(#iosClip)">
    <ellipse cx="512" cy="580" rx="420" ry="70" fill="none" stroke="#00e5c0" stroke-width="3"/>
    <ellipse cx="512" cy="580" rx="300" ry="50" fill="none" stroke="#00e5c0" stroke-width="2.5"/>
    <ellipse cx="512" cy="580" rx="180" ry="30" fill="none" stroke="#00e5c0" stroke-width="2"/>
  </g>

  <!-- ===================== -->
  <!--   FISH ICON (center)  -->
  <!-- ===================== -->
  
  <!-- Fish body - centered and scaled up -->
  <ellipse cx="480" cy="560" rx="220" ry="110" fill="url(#fishGrad)" filter="url(#fishGlow)" opacity="0.95"/>

  <!-- Fish tail -->
  <polygon points="260,560 175,468 175,652" fill="#00c9a7" opacity="0.9"/>

  <!-- Fish tail inner detail -->
  <polygon points="255,560 190,490 190,630" fill="#00e5c0" opacity="0.5"/>

  <!-- Dorsal fin -->
  <path d="M380,450 Q430,370 530,445" fill="none" stroke="#00e5c0" stroke-width="14" stroke-linecap="round" opacity="0.85"/>

  <!-- Pectoral fin (side fin) -->
  <path d="M420,620 Q450,680 520,660" fill="none" stroke="#00c9a7" stroke-width="10" stroke-linecap="round" opacity="0.7"/>

  <!-- Fish scales (arc lines) -->
  <path d="M380,530 Q410,500 440,530" fill="none" stroke="#0a1628" stroke-width="4.5" opacity="0.35"/>
  <path d="M440,530 Q470,500 500,530" fill="none" stroke="#0a1628" stroke-width="4.5" opacity="0.35"/>
  <path d="M500,530 Q530,500 560,530" fill="none" stroke="#0a1628" stroke-width="4.5" opacity="0.35"/>
  <path d="M560,530 Q590,500 620,530" fill="none" stroke="#0a1628" stroke-width="4.5" opacity="0.35"/>
  <path d="M410,570 Q440,540 470,570" fill="none" stroke="#0a1628" stroke-width="4.5" opacity="0.35"/>
  <path d="M470,570 Q500,540 530,570" fill="none" stroke="#0a1628" stroke-width="4.5" opacity="0.35"/>
  <path d="M530,570 Q560,540 590,570" fill="none" stroke="#0a1628" stroke-width="4.5" opacity="0.35"/>

  <!-- Fish eye -->
  <circle cx="615" cy="540" r="26" fill="#0a1628"/>
  <circle cx="615" cy="540" r="15" fill="#ffffff" opacity="0.95"/>
  <circle cx="620" cy="535" r="5" fill="#f5a623"/>

  <!-- ===================== -->
  <!--  IQ SIGNAL ARCS       -->
  <!-- ===================== -->
  <g filter="url(#goldGlow)">
    <path d="M570,440 Q640,360 710,440" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.95"/>
    <path d="M545,400 Q640,290 735,400" fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" opacity="0.7"/>
    <path d="M520,360 Q640,220 760,360" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Small bubbles for underwater feel -->
  <circle cx="750" cy="700" r="12" fill="#00e5c0" opacity="0.25"/>
  <circle cx="780" cy="750" r="8" fill="#00e5c0" opacity="0.2"/>
  <circle cx="800" cy="680" r="6" fill="#00e5c0" opacity="0.15"/>
  <circle cx="270" cy="720" r="10" fill="#00e5c0" opacity="0.2"/>
  <circle cx="240" cy="760" r="6" fill="#00e5c0" opacity="0.15"/>

</svg>
