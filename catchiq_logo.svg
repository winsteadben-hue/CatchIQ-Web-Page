<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <!-- Deep ocean gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2540;stop-opacity:1" />
    </linearGradient>

    <!-- Teal accent gradient for fish -->
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c9a7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00e5c0;stop-opacity:1" />
    </linearGradient>

    <!-- Gold gradient for IQ arc -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5a623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7c560;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter for fish -->
    <filter id="fishGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for gold arc -->
    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip for rounded rect -->
    <clipPath id="roundedClip">
      <rect width="600" height="300" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" rx="18" ry="18" fill="url(#bgGrad)"/>

  <!-- Subtle water ripple lines -->
  <g opacity="0.07" clip-path="url(#roundedClip)">
    <ellipse cx="130" cy="155" rx="110" ry="18" fill="none" stroke="#00e5c0" stroke-width="1.5"/>
    <ellipse cx="130" cy="155" rx="75" ry="12" fill="none" stroke="#00e5c0" stroke-width="1"/>
    <ellipse cx="130" cy="155" rx="40" ry="6" fill="none" stroke="#00e5c0" stroke-width="0.8"/>
  </g>

  <!-- ===================== -->
  <!--   FISH ICON (left)    -->
  <!-- ===================== -->
  <!-- Fish body -->
  <ellipse cx="120" cy="148" rx="58" ry="28" fill="url(#fishGrad)" filter="url(#fishGlow)" opacity="0.95"/>

  <!-- Fish tail -->
  <polygon points="62,148 38,125 38,171" fill="#00c9a7" opacity="0.9"/>

  <!-- Fish tail inner detail -->
  <polygon points="60,148 42,131 42,165" fill="#00e5c0" opacity="0.5"/>

  <!-- Dorsal fin -->
  <path d="M95,120 Q110,100 130,118" fill="none" stroke="#00e5c0" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Fish scales (arc lines) -->
  <path d="M100,138 Q108,130 116,138" fill="none" stroke="#0a1628" stroke-width="1.2" opacity="0.4"/>
  <path d="M115,138 Q123,130 131,138" fill="none" stroke="#0a1628" stroke-width="1.2" opacity="0.4"/>
  <path d="M130,138 Q138,130 146,138" fill="none" stroke="#0a1628" stroke-width="1.2" opacity="0.4"/>
  <path d="M107,150 Q115,142 123,150" fill="none" stroke="#0a1628" stroke-width="1.2" opacity="0.4"/>
  <path d="M122,150 Q130,142 138,150" fill="none" stroke="#0a1628" stroke-width="1.2" opacity="0.4"/>

  <!-- Fish eye -->
  <circle cx="155" cy="143" r="6" fill="#0a1628"/>
  <circle cx="155" cy="143" r="3.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="156.5" cy="141.5" r="1.2" fill="#f5a623"/>

  <!-- Intelligence signal arcs above fish (data/smart indicator) -->
  <g filter="url(#goldGlow)">
    <path d="M148,118 Q165,98 182,118" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M143,110 Q165,85 187,110" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <path d="M138,102 Q165,72 192,102" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- ===================== -->
  <!--   WORDMARK (right)    -->
  <!-- ===================== -->

  <!-- "IQ.Fishing" wordmark -->
  <text x="215" y="165"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="68"
    font-weight="700"
    letter-spacing="-1"><tspan fill="url(#goldGrad)">IQ.</tspan><tspan fill="#ffffff">Fishing</tspan></text>

  <!-- Thin rule under wordmark -->
  <line x1="215" y1="176" x2="520" y2="176" stroke="#00c9a7" stroke-width="1.5" opacity="0.5"/>

  <!-- domain name -->
  <text x="215" y="198"
    font-family="'Courier New', Courier, monospace"
    font-size="14"
    letter-spacing="3"
    fill="#00c9a7"
    opacity="0.7">iq.fishing</text>

  <!-- ===================== -->
  <!--     TAGLINE           -->
  <!-- ===================== -->
  <text x="300" y="242"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="18"
    font-style="italic"
    letter-spacing="1.5"
    fill="#ffffff"
    opacity="0.75"
    text-anchor="middle">Fish Smarter. Every Cast, Every Time.</text>

</svg>
